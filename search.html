<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Explore • Instagram</title>
  <link rel="icon" type="image/png" href="assets/favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --font-family-system: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --ig-primary-background: #ffffff;
      --ig-primary-text: #000000;
      --ig-secondary-text: #737373;
      --ig-stroke: #efefef;
      --ig-link: #0095f6;
      --search-bg: #efeff0;
      --text-gray: #8e8e93;
      --nav-border: #efefef;
      --gap: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0d0d0d;
      font-family: var(--font-family-system);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    img {
      border: 0;
      -webkit-user-drag: none;
      user-select: none;
    }

    .phone-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      height: 100svh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      /* Safe area support for Android/iOS notch & nav bar */
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    @media (min-width: 768px) {
      body {
        background-color: #0d0d0d;
      }

      .phone-container {
        max-width: 430px;
        height: 92vh;
        max-height: 920px;
        border-radius: 36px;
        border: 8px solid #222222;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
    }

    /* Scrollable main content container */
    .search-feed {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      background: #fff;
    }

    .search-feed::-webkit-scrollbar {
      display: none;
    }

    .search-wrap {
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: 10px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--search-bg);
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--text-gray);
    }

    .search-bar svg {
      flex-shrink: 0;
      color: #000000;
    }

    .search-bar span {
      font-size: 15px;
    }

    .explore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
    }

    .tile {
      position: relative;
      background: #000;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      animation: fadeIn 0.5s ease backwards;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .tile-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(14px) brightness(0.65);
      transform: scale(1.3);
      pointer-events: none;
      user-select: none;
    }

    .tile-fg {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
      z-index: 1;
    }

    .badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
      z-index: 2;
    }

    .badge svg {
      width: 14px;
      height: 14px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .top-label {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .illus {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .illus figure {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .illus svg {
      max-width: 80%;
      max-height: 80%;
    }
    
    .illus.couple-a { background: linear-gradient(#f6ecec, #f0e2df); }
    .illus.diagram { background: #f6e3e6; }
    .illus.silhouette { background: linear-gradient(#26242b, #151318); }
    .illus.blue-circle { background: #e3eef0; }
    .illus.purple-box { background: #e9e5f0; }

    .loading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0 40px 0;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #dcdcdc;
      border-top-color: #8e8e93;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 14px;
      /* Pushes content above Android nav bar & iOS home indicator */
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: #fff;
      border-top: 1px solid #efefef;
      z-index: 10;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
    }

    .bottom-nav svg {
      color: #111;
      cursor: pointer;
      display: block;
    }

    .nav-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .nav-item-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nav-red-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #ff3040;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      right: -3.5px;
      bottom: 2px;
      pointer-events: none;
    }
  </style>
</head>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("explore-grid");
      const loader = document.getElementById("loader");
      const searchFeed = document.getElementById("searchFeed");
      
      // Store the exact initial perfectly aligned HTML block
      const repeatingBlockHTML = grid.innerHTML;

      // Use Intersection Observer to detect when the user scrolls near the bottom
      const observer = new IntersectionObserver((entries) => {
        // Check if the loader spinner at the bottom comes into view
        if (entries[0].isIntersecting) {
          // Add a slight delay to mimic network loading and ensure smooth UI feel
          setTimeout(() => {
            // Append the duplicated exact pattern to the bottom of the grid
            grid.insertAdjacentHTML('beforeend', repeatingBlockHTML);
          }, 600);
        }
      }, {
        root: searchFeed,
        rootMargin: "250px"
      });

      // Start observing the loader
      observer.observe(loader);

      // ─── Android Hardware Back Button Fix ────────────────────────────────
      history.pushState({ page: 'search' }, '', window.location.href);
      window.addEventListener('popstate', function () {
        history.pushState({ page: 'search' }, '', window.location.href);
      });
    });
